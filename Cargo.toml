[package]
name = "hizuke"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Metadata-first photo and MP4 renaming with duplicate decisions and recoverable transactions"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = { version = "3.4", features = ["termination"] }
kamadak-exif = "0.6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
lto = "thin"
strip = true
